name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: make install

      # H3-GAP-087 — this repo polices its own count prose: canonical counts
      # (scripts/test-count.txt) → live pytest collection parity → battery parity
      # against the shim checkout → stale-literal sweep with explicit historical
      # exemptions. Exit 1 (drift) / 2 (misconfigured) fail.
      - name: Compliance-test count guard
        run: sh scripts/check-test-count.sh

      - name: Lint
        run: make lint

      - name: Build
        run: make build

      - name: Verify wheel contains package __init__.py files
        # Regression check for DF-001: an unanchored `_*.py` gitignore pattern
        # made hatchling exclude src/h3_harness/__init__.py from wheels,
        # producing an empty namespace package on non-editable installs.
        # `make build` (GAP-009) builds the real wheel into dist/, so this
        # check validates the actual artifact CI ships.
        run: |
          python - <<'EOF'
          import glob, sys, zipfile

          wheels = glob.glob("dist/*.whl")
          assert len(wheels) == 1, f"expected exactly one wheel, got {wheels}"
          names = set(zipfile.ZipFile(wheels[0]).namelist())
          required = {
              "h3_harness/__init__.py",
              "h3_harness/examples/__init__.py",
          }
          missing = sorted(required - names)
          if missing:
              print(f"FAIL: wheel {wheels[0]} is missing: {missing}")
              sys.exit(1)
          print(f"OK: wheel {wheels[0]} contains {len(required)} required __init__.py files")
          EOF

      - name: Test
        run: make test

  # GAP-001 (+ CI-SDKPY-001): compliance gate on the canonical echo harness.
  # The battery (get-h3/shim) is the gate — h3-test exits 0 compliant, 1
  # compliance failure, 2 not an H3 endpoint — and CI serves the battery-ready
  # echo harness (examples/echo.py) and scores it on every push, so a protocol
  # or router refactor can no longer silently break compliance while CI stays
  # green. CI-SDKPY-001: the PASS condition is COUNT-AGNOSTIC. It used to be
  # `grep -q "$passed/$total"`, but the upstream battery count grows as
  # categories are added (44 -> 45 -> 46), so the literal drifted out from under
  # the gate and left main red for days while every test passed (runs
  # 34052395590, 34053098863, 34126139833, 34355416978). The gate now parses the
  # summary's TOTAL line and requires passed == total with total >= MIN_TOTAL — a
  # floor, not a ceiling, so a battery that silently SHRINKS below the floor
  # still fails. NEVER re-introduce a literal count here: the count is the
  # upstream battery's business, the PASS/FAIL semantics are ours. Runs as its
  # own job (not part of the matrix) so the battery executes exactly once.
  battery:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Checkout shim repo (h3-test battery CLI)
        uses: actions/checkout@v4
        with:
          repository: get-h3/shim
          path: shim

      - name: Install SDK (editable)
        run: uv pip install --system -e .

      - name: Install h3-test battery CLI (path-install from checkout — shim unpublished on PyPI, P3-10 blocked)
        run: uv pip install --system ./shim

      - name: Start Echo harness (battery port 9191)
        run: |
          python scripts/serve_echo.py > battery-server.log 2>&1 &
          echo $! > battery-server.pid

      - name: Wait for harness health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9191/v1/health; then
              echo "Harness healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Harness never became healthy; server log:"
          cat battery-server.log || true
          exit 1

      - name: Run h3-test battery (PASS gate — count-agnostic)
        run: |
          set -o pipefail
          # `|| battery_rc=$?` keeps a non-zero h3-test exit recoverable so the
          # step can report it explicitly (0 compliant, 1 compliance failure,
          # 2 not an H3 endpoint) instead of relying on the runner's errexit.
          battery_rc=0
          h3-test --endpoint http://localhost:9191 | tee battery.log || battery_rc=$?
          if [ "$battery_rc" -ne 0 ]; then
            echo "FAIL: h3-test exited ${battery_rc} (0=compliant, 1=compliance failure, 2=not an H3 endpoint)"
            exit "$battery_rc"
          fi
          python3 - <<'PY'
          import re
          import sys

          # CI-SDKPY-001: never gate on a literal count. The upstream battery
          # grew 44 -> 45 -> 46 and a hardcoded `grep -q "$passed/$total"` turned
          # a fully-passing battery into a permanently red build. Gate on the
          # summary's SEMANTICS instead: a TOTAL line reporting every test
          # passing, plus a floor so a battery that silently SHRANK below it
          # still fails. The floor only guards against a truncated run — the
          # PASS/FAIL semantics are ours, the count is the battery's.
          MIN_TOTAL = 45

          log = open("battery.log", encoding="utf-8", errors="replace").read()

          m = re.search(r"^\s*TOTAL\s+(\d+)/(\d+)\s+PASSED\s*$", log, re.MULTILINE)
          if m is None:
              print("FAIL: no 'TOTAL <passed>/<total> PASSED' line found in battery.log")
              sys.exit(1)

          passed, total = int(m.group(1)), int(m.group(2))
          print(f"battery summary: TOTAL {passed}/{total} PASSED (floor {MIN_TOTAL})")

          if passed != total:
              print(f"FAIL: not every battery test passed ({passed}/{total})")
              sys.exit(1)
          if total < MIN_TOTAL:
              print(f"FAIL: battery total {total} is below the {MIN_TOTAL}-test floor")
              sys.exit(1)

          print(f"OK: count-agnostic PASS gate satisfied — {passed}/{total} passed, total >= {MIN_TOTAL}")
          PY

  # GAP-032: release-readiness gate — the published PyPI wheel must not lag
  # the repo version. GAP-019/025/029 fixes were complete on main for days
  # while the published 0.1.2 wheel stayed stale, so package consumers never
  # received them. This job fetches the latest published version from PyPI
  # and fails when it is OLDER than the version declared in pyproject.toml:
  # new fixes must not land on main while the wheel that ships them is
  # unpublished. Publishing (`make build && uv publish`) makes the gate pass
  # on the next push. Hard gate on push to main; on PRs it runs as
  # informational context (same comparison, non-blocking).
  release-readiness:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch published version from PyPI
        id: pypi
        run: |
          curl -sf https://pypi.org/pypi/h3-harness-sdk/json -o /tmp/pypi.json
          python -c "import json; print(json.load(open('/tmp/pypi.json'))['info']['version'])" > /tmp/published.txt
          echo "published=$(cat /tmp/published.txt)" >> "$GITHUB_OUTPUT"

      - name: Compare repo version vs published (fail if PyPI lags)
        run: |
          REPO_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          PUBLISHED_VERSION="${{ steps.pypi.outputs.published }}"
          echo "repo version:      ${REPO_VERSION}"
          echo "published version: ${PUBLISHED_VERSION}"
          python - "$REPO_VERSION" "$PUBLISHED_VERSION" <<'EOF'
          import re, sys

          def parse(v: str) -> tuple:
              return tuple(int(x) for x in re.findall(r"\d+", v))

          repo, published = parse(sys.argv[1]), parse(sys.argv[2])
          if published < repo:
              print(
                  f"FAIL: PyPI has {sys.argv[2]} but repo is {sys.argv[1]} — "
                  "fixes are landing without a published wheel. "
                  "Run: make build && uv publish"
              )
              sys.exit(1)
          print("OK: published wheel is current (or ahead of repo)")
          EOF

      # GAP-043: content-staleness gate — version equality is not content
      # equality. The 0.1.3 wheel shipped with a hardcoded ACTIVE status
      # while repo HEAD carried the GAP-035 _session_status logic, and the
      # version-only compare above stayed green (0.1.3 == 0.1.3). This step
      # installs the PUBLISHED wheel into a scratch venv (never the local
      # source tree) and asserts the GAP-035 logic is actually present in
      # the shipped harness module. Fails when the wheel is content-stale
      # even if version numbers match.
      - name: Verify published wheel content (GAP-035 _session_status present)
        run: |
          python -m venv "$RUNNER_TEMP/gap043-venv"
          "$RUNNER_TEMP/gap043-venv/bin/pip" install --quiet h3-harness-sdk
          "$RUNNER_TEMP/gap043-venv/bin/python" - <<'EOF'
          import inspect
          import sys

          import h3_harness.harness as h

          # _session_status is a module-level helper (not a BaseHarness
          # method), so probe the module source, not the class source.
          if not hasattr(h, "_session_status") or "_session_status" not in inspect.getsource(h):
              print(
                  "FAIL: published wheel is content-stale — GAP-035 "
                  "_session_status logic missing from h3_harness.harness. "
                  "Version numbers match but content drifted. "
                  "Rebuild from repo HEAD and publish again."
              )
              sys.exit(1)
          print("OK: published wheel contains GAP-035 _session_status logic")
          EOF

      # GAP-061: same-version content staleness, third occurrence of the class
      # (0.1.3, 0.1.4, 0.1.5). The version compare above is version-only, and
      # GAP-043's probe keys on one helper's source text — so a wheel cut from
      # an older tree that still carries _session_status can stay green while
      # the rest of the module is stale, and a FROZEN version number certifies
      # nothing at all. The published 0.1.5 wheel is exactly that case: same
      # version as repo HEAD, but a 267-line harness.py predating fea1855
      # (live-session tracking), which repo HEAD carries.
      # This step installs the PUBLISHED wheel at the version just fetched and
      # asserts a symbol only the current HEAD harness defines, so a stale
      # artifact fails the gate even when the version number matches. The
      # version compare and the GAP-043 probe above are untouched (additive).
      - name: Verify published artifact content at the published version (GAP-061)
        run: |
          VENV="$RUNNER_TEMP/gap061-venv"
          PUBLISHED_VERSION="${{ steps.pypi.outputs.published }}"
          echo "probing published artifact h3-harness-sdk==${PUBLISHED_VERSION}"

          python -m venv "$VENV"

          # Pin the version just fetched. A fresh publish can lag on the PyPI
          # CDN for a few seconds, so retry before calling the artifact
          # unavailable — but never fall back to an unpinned install, which
          # could resolve to a different artifact than the one under gate.
          installed=0
          for attempt in $(seq 1 6); do
            if "$VENV/bin/pip" install --quiet --no-cache-dir \
                "h3-harness-sdk==${PUBLISHED_VERSION}"; then
              installed=1
              echo "installed h3-harness-sdk==${PUBLISHED_VERSION} on attempt ${attempt}"
              break
            fi
            echo "attempt ${attempt}: install failed (CDN propagation?); retrying in 10s"
            sleep 10
          done
          if [ "$installed" -ne 1 ]; then
            echo "FAIL: could not install h3-harness-sdk==${PUBLISHED_VERSION} after 6 attempts — PyPI advertises the version but the artifact is not fetchable"
            exit 1
          fi

          "$VENV/bin/python" - <<'EOF'
          import sys

          from h3_harness import BaseHarness

          # One symbol, the live-session tracking marker from fea1855: absent
          # from the published 0.1.5 wheel, present at repo HEAD.
          MARKER = "active_session_count"

          if not callable(getattr(BaseHarness, MARKER, None)):
              print(
                  "FAIL: published artifact is STALE at same version — "
                  f"BaseHarness.{MARKER} is missing from the wheel on PyPI. "
                  "The version number matches the repo but the content does "
                  "not: the artifact predates the live-session tracking work. "
                  "Rebuild from HEAD and publish again (uv build && uv publish)."
              )
              sys.exit(1)
          print(f"OK: published artifact carries BaseHarness.{MARKER} — content is current")
          EOF

  # GAP-040: docs-version-sweep gate — every release (0.1.1→0.1.2→0.1.3) has
  # produced a new stale-version GAP row (GAP-014, GAP-016, GAP-037-adjacent,
  # GAP-039) because no release checklist covered doc-version references.
  # This job fails CI when a scoped LIVING doc line that asserts a version
  # (contains "h3-harness-sdk", "h3_harness", "__version__", or
  # "published version") references a version older than the release
  # authority. Authority order (GAP-068): pyproject.toml [project] version
  # is the single release authority and the sweep's PRIMARY source — the
  # hardcoded _version.py module drifted from pyproject (0.1.6 published
  # while the wire served "0.1.5") — with the __version__ regex in
  # src/h3_harness/_version.py kept as a fallback for safety.
  # Historical records are excluded by scope: CHANGELOG.md (release history
  # is intentionally versioned) and docs/dogfood/** (dated incident records)
  # are never scanned. Hard gate on push to main and on PRs.
  docs-version-sweep:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sweep living docs for stale version references
        run: |
          python - <<'EOF'
          import glob, re, sys

          # Release authority: pyproject.toml [project] version, read with
          # tomllib (GAP-068). Fallback: the __version__ regex in
          # src/h3_harness/_version.py (the module now derives its value at
          # import time from install metadata / pyproject) — kept only for
          # safety if pyproject.toml is ever unreadable or restructured.
          current = None
          try:
              import tomllib

              pyproject_version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
              m = re.search(r"\d+\.\d+\.\d+", pyproject_version)
              if m is not None:
                  current = tuple(int(x) for x in m.group(0).split("."))
          except (ImportError, FileNotFoundError, KeyError, TypeError):
              current = None
          if current is None:
              # Safety fallback: the __version__ regex in _version.py. The
              # module derives its value dynamically now, so this matches
              # only if a literal assignment is ever reintroduced;
              # otherwise fail loudly — an unreadable pyproject.toml means
              # the release authority itself is broken.
              version_file = "src/h3_harness/_version.py"
              try:
                  m = re.search(r'__version__\s*=\s*["\']([^"\']+)["\']', open(version_file).read())
              except FileNotFoundError:
                  m = None
              if m is None:
                  print(
                      "FAIL: cannot resolve current version — pyproject.toml "
                      "unreadable and no literal __version__ in "
                      "src/h3_harness/_version.py (GAP-068 authority order)"
                  )
                  sys.exit(2)
              current = tuple(int(x) for x in m.group(1).split("."))
          current_str = ".".join(str(x) for x in current)

          # Living docs only. Historical records are excluded by scope:
          # CHANGELOG.md (release history is intentionally versioned) and
          # docs/dogfood/** (dated incident records) are never scanned.
          files = sorted(glob.glob("docs/api/*.md")) + [
              "README.md",
              "CONTRIBUTING.md",
              "skills/h3-sdk-python-usage/SKILL.md",
          ]

          KEYWORDS = (
              "h3-harness-sdk",
              "h3_harness",
              "__version__",
              "published version",
              "Current published version",
          )
          VERSION_RE = re.compile(r"\b\d+\.\d+\.\d+\b")

          violations = []
          found_files = []
          for path in files:
              try:
                  lines = open(path).read().splitlines()
              except FileNotFoundError:
                  continue
              found_files.append(path)
              for lineno, line in enumerate(lines, 1):
                  if not any(k in line for k in KEYWORDS):
                      continue
                  versions = [tuple(int(x) for x in v.split(".")) for v in VERSION_RE.findall(line)]
                  if not versions:
                      continue
                  stale = [v for v in versions if v < current]
                  if stale:
                      violations.append(f"{path}:{lineno}: {line}")

          if violations:
              print("\n".join(violations))
              print(
                  f"FAIL: docs reference stale version {current_str} — "
                  f"bump to {current_str} or mark the doc historical "
                  "(SUPERSEDED banner / date)"
              )
              sys.exit(1)
          print(f"OK: {len(found_files)} living docs reference only version {current_str}")
          EOF

