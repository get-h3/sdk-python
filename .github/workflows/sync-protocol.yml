name: Sync Protocol

on:
  # GAP-073: an SDK source change must exercise the cross-language round-trip,
  # not only a protocol dispatch. Before this, a wire-format-breaking change to
  # the harness/protocol source shipped with every workflow green and zero
  # round-trip runs. Paths are scoped to the files that can change the SDK's
  # wire behaviour (including the generated src/h3_harness/protocol.py and the
  # vendored tests/schemas/v1 it generates from); board/.vfs/.gitreins
  # bookkeeping and prose docs are excluded, so a foreman bookkeeping commit
  # cannot fire the workflow.
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "pyproject.toml"
      - "pytest.ini"
      - "uv.lock"
      - "Makefile"
      - ".github/workflows/sync-protocol.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "pyproject.toml"
      - "pytest.ini"
      - "uv.lock"
      - "Makefile"
      - ".github/workflows/sync-protocol.yml"
  repository_dispatch:
    types: [protocol-update]
  workflow_dispatch:
    inputs:
      protocol_version:
        description: 'Protocol tag (e.g., v1.0.1)'
        required: true
        type: string

env:
  PROTOCOL_VERSION: ${{ github.event.client_payload.protocol_version || inputs.protocol_version }}

jobs:
  regenerate:
    # GAP-073: this job regenerates from a tagged protocol release and then
    # commits, tags and PUBLISHES TO PyPI. PROTOCOL_VERSION resolves only from
    # client_payload/inputs, so on a push it is empty and the "Fetch protocol
    # schemas" step fetches .../refs/tags/.tar.gz — a 404 body piped into tar,
    # i.e. a guaranteed failure that would skip the round-trip job it `needs:`.
    # Keep it pinned to the events it was written for; the round-trip job runs
    # for every event.
    if: ${{ github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: make install

      - name: Fetch protocol schemas
        run: |
          echo "Fetching protocol ${PROTOCOL_VERSION}"
          curl -sL "https://github.com/get-h3/protocol/archive/refs/tags/${PROTOCOL_VERSION}.tar.gz" | tar xz
          mv "protocol-"* protocol-src

      - name: Regenerate types
        # DF-H3-SDK-PYTHON-FOREMAN-2: the resolver now falls back to the
        # VENDORED tests/schemas/v1 when there is no sibling ../protocol
        # checkout, so this job must point it at the tag it just fetched.
        # Without the pin it would regenerate from the stale vendored copy and
        # report "no protocol changes", silently ending the sync path.
        env:
          H3_SCHEMA_DIR: protocol-src/schemas/v1
        run: make generate

      - name: Refresh vendored schema copies
        # tests/schemas/v1 is what a standalone clone generates from, so it has
        # to track the fetched tag — otherwise a fresh clone regenerates the
        # previous protocol models onto a newer committed protocol.py.
        run: cp protocol-src/schemas/v1/*.json tests/schemas/v1/

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No protocol changes detected."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit generated code
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "sync: regenerate from protocol ${PROTOCOL_VERSION}"

      - name: Bump version
        if: steps.changes.outputs.changed == 'true'
        run: |
          # Extract version from tag (strip 'v' prefix)
          V="${PROTOCOL_VERSION#v}"
          # Update pyproject.toml version
          sed -i "s/^version = \".*\"/version = \"${V}\"/" pyproject.toml
          git add pyproject.toml
          git commit -m "release: bump to ${PROTOCOL_VERSION}" || true

      - name: Tag and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git tag "${PROTOCOL_VERSION}"
          git push origin main --tags

      - name: Build package
        if: steps.changes.outputs.changed == 'true'
        run: uv build

      - name: Publish to PyPI
        if: steps.changes.outputs.changed == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  roundtrip:
    # GAP-073: unchanged for repository_dispatch/workflow_dispatch — a failed
    # regeneration/publish still blocks the round-trip — but a SKIPPED
    # regenerate (the push/pull_request path, where it holds no work) must not.
    needs: regenerate
    if: ${{ !cancelled() && (needs.regenerate.result == 'success' || needs.regenerate.result == 'skipped') }}
    uses: get-h3/h3/.github/workflows/roundtrip.yml@main
