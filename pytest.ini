[pytest]
# Bare `pytest` on an ambient interpreter (no project venv active) cannot
# import h3_harness from the src/ layout — pythonpath adds the source tree to
# sys.path at startup so collection works without installing the package.
pythonpath = src
testpaths = tests
asyncio_mode = auto
# NOTE: benchmark tuning lives on the tests themselves
# (@pytest.mark.benchmark(min_rounds=3, max_time=0.5) in test_benchmarks.py)
# because pytest-benchmark 5.2.3 registers no ini keys — hardcoding
# --benchmark-* flags in addopts makes bare `python3 -m pytest` crash with
# "unrecognized arguments" on installs without the plugin (GAP-008).
