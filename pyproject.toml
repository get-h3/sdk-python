[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "h3-harness-sdk"
version = "0.1.0"
description = "Python SDK for building H3-compliant agent harnesses"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Total Windup Flight Systems"}
]
keywords = ["h3", "hermes", "agent", "harness"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.109.0",
    "pydantic>=2.0",
    "uvicorn[standard]>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-benchmark>=5.2.3",
    "httpx>=0.26",
    "jsonschema>=4.20",
    "ruff>=0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/h3_harness"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# NOTE: benchmark tuning lives on the tests themselves
# (@pytest.mark.benchmark(min_rounds=3, max_time=0.5) in test_benchmarks.py)
# because pytest-benchmark 5.2.3 registers no ini keys — hardcoding
# --benchmark-* flags in addopts makes bare `python3 -m pytest` crash with
# "unrecognized arguments" on installs without the plugin (GAP-008).
