guards:
  secrets: true
  lint: true
  tests: true
  test_mode: diff
  test_command: .venv/bin/python -m pytest -x --tb=short -q
  # allow_skips: this repo's foreman loop commits board-only changes
  # (.coding-hermes/board/*.jsonl) every tick. Those commits stage no source
  # and no test files, so the lint/tests lanes have nothing to grade and
  # gitreins 0.13.0 reports them as DEGRADED PASS with exit 2 — which this
  # repo's .git/hooks/pre-commit (plain `gitreins guard; exit $?`) turns into
  # a BLOCKED commit, i.e. the shared board could not be written at all.
  # allow_skips accepts zero-work runs as PASS; lanes still run and still fail
  # the commit whenever a source/test file IS staged. See foreman tick #294.
  allow_skips: true
# Escalation history — tier-2 rung, measured (foreman tick #299, 2026-09-19):
#   1. 2026-09-18 df-h3-sdk-python-foreman-1 (docs + live-verification
#      criterion: README Quickstart extracted verbatim, run under uvicorn, the
#      46-test battery re-run) returned tier1 PASS + tier2 INCOMPLETE =
#      "Partial verdict — evaluation hit resource cap before all criteria
#      verified" at 1,039,907 input tokens against the then-1M rung.
#   2. 2026-09-19 the SAME task and criteria were re-run instrumented (tier-2
#      token spy): 41 LLM calls, last iteration 40/50, peak counter 1,029,521
#      -> "Input token budget (1.0M) exceeded (1.0M used)", tier1 PASS, zero
#      compactions (no valve is configured, so the counter only ever grows),
#      wall clock 170s. Fitted growth law: P0=3,831 + 1,064 tokens/call, i.e.
#      total(N calls) = N*P0 + 1064*N*(N-1)/2 -> projections N=50: 1.49M,
#      N=100: 5.65M.
# Two starvations at the SAME rung license exactly one raise, sized from the
# measurement instead of from the verdict text: a 100-iteration budget projects
# 5.65M, so 8M covers the whole iteration budget with ~1.4x headroom, and 20m
# covers the measured 4.2s/iteration (~7 min at 100 iterations) with ~3x
# headroom. Applied as a PROBE to unblock: the next eval records its own total,
# and the settled rung is the smallest one that completes with no cap line —
# do not re-ladder from the symptom (see skill gitreins-cap-sizing).
#  3. 2026-09-19 (tick #300, GAP-057): the rung is settled by MEASUREMENT, and
#     the measurement fell the OTHER way from the guess. The 8M probe was
#     stepped down to 2M and the step-down was TESTED on this task's own
#     lifecycle eval: it STARVED — verdict 7d19e63e, 2,030,197 input tokens,
#     "Input token budget (2.0M) exceeded (2.0M used)", tier1 PASS. Note where it
#     died: the judge had already verified clauses (a) and (c) of the criterion,
#     so the eval was a fraction past the rung (a second reason to distrust the
#     probe value). The rung is therefore set to 4M — the smallest value that
#     covers BOTH measured samples (the docs sample, 1,380,265 = verdict
#     827a214f, no cap line; and the starved 2M run, 2,030,197) with 1.3x
#     headroom — and re-measured in this same tick; the settling verdict's id and
#     token total are recorded on board row GAP-057 and in the board audit event.
#     Iterations (100) and time (20m) do NOT move with the token rung: run
#     bc9aaac8 proved the iteration knob already sufficient (it died at
#     'Iteration cap (100) reached (100.2 used)' while using 39% of the token
#     rung), i.e. the criterion, not the budget, was the driver in that run.
#     The context-growth valve is NOT configurable into usefulness at a rung of
#     this size, and that is measured rather than assumed. The engine fires
#     compaction when the LARGEST SINGLE PROMPT crosses
#     `compaction_threshold x max_input_tokens` (engine/evaluator.py:
#     `threshold_ratio = evaluator_cfg.get("compaction_threshold", 0.90)`
#     compared against `cumulative_prompt_tok = max(cumulative_prompt_tok,
#     prompt_tok)`; its own regression tests pin that semantics —
#     tests/test_evaluator.py::test_compaction_threshold_config_override feeds a
#     600-token SINGLE call against a 1000-token cap at threshold 0.50, and
#     ::test_compaction_threshold_not_triggered_below shows 400 tokens against a
#     10000 cap NOT firing). The counter the CAP enforces is the SUM over calls
#     (engine/eval_cap.py `record_llm_call` -> `cumulative_input_tokens +=
#     all_input`), so at 4M/0.90 a single prompt would have to exceed 3.6M tokens
#     while this repo's measured peak single prompt is ~46K (P0=3,831 + 1,064
#     tokens/call over the 41-call run, tick #299 spy) = 77.6x below the trigger.
#     The ratio that WOULD fire at that peak is 0.012 at a 4M rung and 0.006 at
#     8M — a magic number
#     read off one task's growth law, and one that makes the valve thrash (a
#     tool-heavy run adding ~5K tokens/call crosses a 46K trigger in ~5 calls and
#     burns the engine's 3-compaction allowance before the first criterion is
#     verified). So the counter growth is ACCEPTED and bounded by the rung
#     instead: settle the rung from a measured sample and keep criteria bounded.
#     The engine-side fix — comparing the metered cumulative counter, the
#     quantity the cap actually enforces — belongs to gitreins, not to this
#     repo's config (handed off as GR-GAP-062).
evaluator:
  max_iterations: 100
  max_time: 20m
  max_input_tokens: 4M
  max_output_tokens: 0.4M
  tool_call_weight: 0.1
  fast_track: auto
pipeline:
  stages:
    - id: tier1
      parallel: true
      on: [pre-commit, pre-eval]
      steps:
        - id: guard
          type: script
          run: "gitreins guard"
          on_fail: block
    - id: tier2
      type: ai_eval
      on: [pre-eval]
      condition: "true"
      # MIN(top-level evaluator, this stage) gates every knob, so this value must
      # move with evaluator.max_iterations or the raise above buys nothing.
      max_iterations: 100
      tools: [read_file, run_command, search_pattern, read_diff, sandbox, detect_dead_code]

defaults:
  model: deepseek-v4-flash
  provider: deepseek-foreman
  api_key_env: GITREINS_LLM_API_KEY
